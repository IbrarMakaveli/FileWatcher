appName: FileWatcher
appPath: ''
args:
  default:
    minsize: 1B
    regex: ''
    timewait: 00:00:00
    worker: 10
data:
  path: ''
logs:
  defaultFile: filewatcher_daemon.log
  logFormat: '%Y-%m-%d %H:%M:%S'
  logLevel: INFO
  logMessage: '%(asctime)s [%(levelname)s] [%(threadName)s | %(funcName)s]  %(message)s'
  path: ''
pid:
  defaultFile: daemonrun.pid
  path: ''
