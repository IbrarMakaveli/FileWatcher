[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filewatcher"
version = "1.1.0"
description = "FileWatcher project for launching a command when receiving a file, with configuration by YAML file"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ibrar ARIF", email = "ibrar95140@gmail.com" }]
requires-python = ">=3.9"
keywords = ["filewatcher", "watchdog", "realtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "PyYAML>=6.0.2",
    "watchdog>=4.0,<7",
    "humanfriendly>=10.0",
    "tabulate>=0.10.0",
]

[project.urls]
Repository = "https://github.com/IbrarMakaveli/FileWatcher"

[project.scripts]
filewatcher = "filewatcher.__main__:main"

[tool.setuptools.packages.find]
include = ["filewatcher*"]

[tool.setuptools.package-data]
"filewatcher.config" = ["config.yaml"]
